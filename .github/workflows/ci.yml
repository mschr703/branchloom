name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies with bounded retry
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            $result = $LASTEXITCODE
            if ($result -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $result }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - run: npm audit --audit-level=critical
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:f17
      - run: npm run smoke:team-review
      - run: npm run smoke:dev-accounts
      - run: node scripts/smoke-electron.mjs --f01 --timeout-ms 180000
      - run: node scripts/smoke-electron.mjs --f03 --timeout-ms 180000
      - run: node scripts/smoke-electron.mjs --g02 --timeout-ms 240000
      - run: node scripts/smoke-electron.mjs --g02-auto --timeout-ms 180000
      - run: node scripts/smoke-electron.mjs --usage --timeout-ms 120000
      - run: node scripts/smoke-electron.mjs --changelog --timeout-ms 120000
      - run: node scripts/smoke-electron.mjs --whiteboard --timeout-ms 120000
      - run: node scripts/smoke-electron.mjs --chat-canvas --timeout-ms 120000
      - run: node scripts/check-public.mjs

  portable-windows:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      BRANCHLOOM_TRELLO_PUBLIC_KEY: ${{ vars.BRANCHLOOM_TRELLO_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies with bounded retry
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            $result = $LASTEXITCODE
            if ($result -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $result }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - run: npm run make:win
      - run: npm run smoke:package
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: branchloom-windows-portable
          path: out/make/zip/win32/x64/*.zip
          if-no-files-found: error

  installer-windows:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      BRANCHLOOM_TRELLO_PUBLIC_KEY: ${{ vars.BRANCHLOOM_TRELLO_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies with bounded retry
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            $result = $LASTEXITCODE
            if ($result -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $result }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - run: npm run make:installer
      - run: node scripts/smoke-electron.mjs --executable out/installer/win-unpacked/Branchloom.exe
      - run: node scripts/check-package.mjs out/installer/win-unpacked/resources/app
      - run: node scripts/check-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: branchloom-windows-installer
          path: out/installer/Branchloom-Setup-*.exe
          if-no-files-found: error
